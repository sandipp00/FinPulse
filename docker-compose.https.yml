# Adds free automatic HTTPS. Use together with the base file:
#
#   DOMAIN=finpulse.example.com docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
#
# Needs a domain name pointing at this machine and ports 80 and 443 reachable
# from the internet (a free DuckDNS / similar subdomain is fine).

services:
  api:
    environment:
      COOKIE_SECURE: "true"       # the login cookie is only ever sent over HTTPS

  web:
    ports: !reset []              # no longer exposed directly; Caddy is the front door

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the hostname you are serving, e.g. finpulse.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data           # certificates live here; keep this volume
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
