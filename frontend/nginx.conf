# Serves the built single-page app and forwards /api and /ws to the API container.

# Extra brake on password guessing; the API also rate limits per email and IP.
limit_req_zone $binary_remote_addr zone=auth:1m rate=20r/m;

# When another proxy (Caddy / a tunnel) sits in front on the Docker network, trust it to
# report the real client address, so rate limits apply per person, not per proxy.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;   # the API only takes tiny JSON bodies

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (declared once at server level; a location that adds its own
    # add_header would drop these, so locations below only use `expires`).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params.inc;
        proxy_pass http://api:8000;
    }

    location /api/ {
        include /etc/nginx/proxy_params.inc;
        proxy_pass http://api:8000;
    }

    location /ws/ {
        include /etc/nginx/proxy_params.inc;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;   # the price stream is long-lived
    }

    # Hashed build assets never change, so cache them hard.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html, which must not be cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
