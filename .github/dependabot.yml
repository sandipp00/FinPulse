# Monthly pull requests when a dependency, GitHub Action or Docker base image has a newer
# release. Every PR runs the CI workflow, so a bad upgrade shows up as a red check before
# anything is merged.
version: 2

updates:
  # Python. The requirements files use ">=" floors, so "increase" is what makes Dependabot
  # raise the floor to a newer release (without it, nothing is ever "out of date").
  # requirements.txt pulls in the other requirements-*.txt files with -r.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "deps(python)"
    groups:
      python-minor-and-patch:        # one PR for the routine updates; majors stay separate
        patterns: ["*"]              # every dependency (a group with only update-types matched none here)
        update-types: [minor, patch]
    ignore:
      # numpy 2.5 and later need Python 3.12 or newer, but CI and the Docker image run 3.11,
      # so those versions cannot be installed (this is exactly how CI failed on PR #3).
      # Patch releases of 2.4.x still come through. Remove this when moving to Python 3.12.
      - dependency-name: numpy
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Frontend (React, Vite, Recharts, ESLint, Vitest, ...)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: "deps(frontend)"
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  # The actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: "deps(ci)"

  # Base images in the Dockerfiles (python, node, nginx)
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps(docker)"
    ignore:
      # Node majors are chosen on purpose (an even-numbered LTS release), not whatever is newest:
      # Dependabot's first proposal was Node 25, which is a short-lived "Current" release.
      # nginx patch/minor updates still come through. Change the Node line by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Images named in the Compose files (Caddy, Mailpit)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps(docker)"
