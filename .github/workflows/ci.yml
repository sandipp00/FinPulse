name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker images and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate the Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.mail.yml config --quiet
          DOMAIN=ci.example docker compose -f docker-compose.yml -f docker-compose.https.yml config --quiet

      - name: Build and start the stack
        # --wait blocks until every container's health check passes.
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          set -eu
          base=http://localhost:8080

          curl -fsS "$base/healthz"
          curl -fsS "$base/api/health"
          curl -fsS "$base/api/auth/me" | grep -q '"user":null'

          # Direct links to the sign-in and sign-up pages work: nginx falls back to the app.
          curl -fsS "$base/signin" | grep -q '<div id="root">'
          curl -fsS "$base/signup" | grep -q '<div id="root">'
          curl -fsS "$base/no/such/page" | grep -q '<div id="root">'
          for page in equities crypto fx macro markets explorer portfolio analytics research risk settings help; do
            curl -fsS "$base/$page" | grep -q '<div id="root">'
          done

          # The instrument catalogue answers and stored history can be charted.
          curl -fsS "$base/api/instruments" | grep -q '"instruments"'

          # FX answers with every pair, marked unavailable if the runner cannot reach the source.
          curl -fsS "$base/api/fx/pairs" | grep -q '"pairs"'

          # Without a FRED key, macro data says it is not configured rather than failing.
          curl -fsS "$base/api/macro/series" | grep -q '"configured":false'

          # The risk report responds even if the exchange cannot be reached from the runner.
          curl -fsS --max-time 90 "$base/api/risk" | grep -q '"assets"'

          # nginx adds the security headers.
          curl -sI "$base/" | grep -qi '^content-security-policy:'
          curl -sI "$base/" | grep -qi '^x-frame-options: deny'

          # Paper trading needs a login.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/paper/portfolio")" = 401

          # A state-changing request from another website is refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Origin: https://evil.example' -H 'Content-Type: application/json' \
            -d '{}' "$base/api/auth/logout")" = 403

          echo "Smoke test passed"

      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Stop the stack
        if: always()
        run: docker compose down -v
